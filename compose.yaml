name: ecomart

services:
  # ── PostgreSQL (database) ───────────────────────────────────
  postgres:
    image: 'postgres:16-alpine'
    container_name: ecomart-postgres
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-ecomart_db}'
      - 'POSTGRES_USER=${POSTGRES_USER:-postgres}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgrespassword}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecomart_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── EcoMart Backend (Spring Boot app) ──────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecomart-backend
    environment:
      # Kích hoạt profile "docker" -> dùng PostgreSQL thay vì H2
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:-ecomart_db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      # JWT (có thể override qua .env)
      APP_JWT_SECRET: ${APP_JWT_SECRET:-9a4f2c8d7e1b5a3f6c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      TZ: UTC
    ports:
      - '${APP_PORT:-8081}:8081'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:8081/swagger-ui.html']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres_data:
