services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: techhub-postgres
    environment:
      - 'POSTGRES_DB=techhub_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgrespassword'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
