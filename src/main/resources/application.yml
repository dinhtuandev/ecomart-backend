server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ecomart-backend

  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecomart_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'

# Resend Email Configuration (được nạp trực tiếp từ file .env)
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

# Application Custom Properties (được nạp trực tiếp từ file .env)
app:
  jwt:
    secret: ${APP_JWT_SECRET:9a4f2c8d7e1b5a3f6c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE:ECOMART1}
      hash-secret: ${VNPAY_HASH_SECRET:9A4F2C8D7E1B5A3F6C0D9E8F7A6B5C4D}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay/return}
    sepay:
      api-key: ${SEPAY_API_KEY:sepay_secret_api_key}
      account-number: ${SEPAY_ACCOUNT_NUMBER:109876543210}
      bank: ${SEPAY_BANK:970415}
      qr-url-template: ${SEPAY_QR_URL_TEMPLATE:https://img.vietqr.io/image/{bank}-{acc}-compact2.png?amount={amount}&addInfo={des}}

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
