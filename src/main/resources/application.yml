server:
  port: 8081

spring:
  application:
    name: ecomart-backend

  # Bỏ qua Docker Compose khi chạy; dùng H2 in-memory mặc định để chạy trực tiếp
  # không cần bật PostgreSQL/Docker Desktop. Nếu muốn dùng Docker/PostgreSQL,
  # bật lại (xóa hoặc đổi thành true) và chỉnh url, username, password bên dưới.
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:h2:mem:ecomartdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'

# JWT Configuration
app:
  jwt:
    secret: 9a4f2c8d7e1b5a3f6c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
    expiration-ms: 86400000 # 24 hours

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
