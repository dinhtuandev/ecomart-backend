server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ecomart-backend

  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: UTC
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'

# Resend Email Configuration (được nạp trực tiếp từ file .env)
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}

# Application Custom Properties (được nạp trực tiếp từ file .env)
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS}
  payment:
    vnpay:
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      pay-url: ${VNPAY_PAY_URL}
      return-url: ${VNPAY_RETURN_URL}
    sepay:
      api-key: ${SEPAY_API_KEY}
      account-number: ${SEPAY_ACCOUNT_NUMBER}
      bank: ${SEPAY_BANK}
      qr-url-template: ${SEPAY_QR_TEMPLATE}

# OpenAPI / Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
